services:
  - type: web
    name: momentlink-cloud
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLOUD_SYNC_TOKEN
        generateValue: true
      - key: PUBLIC_GALLERY_BASE_URL
        sync: false
      - key: GALLERY_CORS_ORIGINS
        value: https://photoflow-seven.vercel.app
